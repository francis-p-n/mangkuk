<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Document checks</title>
<link rel="stylesheet" href="app.css">
<style>
.gate { min-height: 100vh; display: grid; place-items: center; padding: 28px 20px; }
.gate-card {
  width: 100%; max-width: 420px; background: var(--card);
  border: 1px solid var(--rule); border-radius: var(--r-lg); padding: 32px 34px 28px;
}
.gate h1 { font-size: 26px; margin: 0 0 4px; }
.gate .lede { color: var(--ink-soft); font-size: 15px; margin: 0 0 24px; }
.field { display: block; margin-bottom: 15px; }
.field span { display: block; font-size: 14px; color: var(--ink-soft); margin-bottom: 5px; }
.field input {
  width: 100%; font: inherit; font-size: 15px; padding: 10px 13px; color: var(--ink);
  background: var(--paper); border: 1px solid var(--rule-firm); border-radius: var(--r);
}
.field input:focus { border-color: var(--brand); }
.gate .btn { width: 100%; padding: 11px; font-size: 15.5px; margin-top: 6px; }
.err { color: var(--fix); font-size: 14px; margin: 0 0 12px; }
.demo-note {
  margin: 22px 0 0; padding: 13px 15px; border-radius: var(--r);
  background: var(--look-wash); border: 1px solid var(--look-rule);
  color: var(--look); font-size: 14px; line-height: 1.55;
}
.gate footer { margin-top: 20px; font-size: 13.5px; color: var(--ink-faint); text-align: center; }
</style>
</head>
<body>
<div class="gate">
  <div class="gate-card">
    <h1>Document checks</h1>
    <p class="lede">Shipping documentation desk</p>

    <form id="signin" novalidate>
      <p class="err" id="err" hidden></p>
      <label class="field">
        <span>Work email</span>
        <input type="email" id="email" autocomplete="username"
               placeholder="you@averis.com" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="password" autocomplete="current-password" required>
      </label>
      <button class="btn go" type="submit">Sign in</button>
    </form>

    <p class="demo-note">
      <b>Demo sign-in.</b> This is a prototype: nothing is checked, nothing is
      sent anywhere, and no password is stored. Enter any email and any
      password to look around.
    </p>

    <footer>Averis hackathon prototype</footer>
  </div>
</div>

<script>
// A real deployment puts an identity provider in front of this page. Nothing
// here authenticates anyone; it only remembers a display name so the rest of
// the prototype has something to greet you with. The password is read to
// validate the form and then goes out of scope - it is never stored or sent.
const form = document.getElementById("signin");
const err = document.getElementById("err");

function fail(message, focus) {
  err.textContent = message;
  err.hidden = false;
  if (focus) focus.focus();
}

form.addEventListener("submit", e => {
  e.preventDefault();
  err.hidden = true;

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email) return fail("Enter your work email to continue.", document.getElementById("email"));
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))
    return fail("That does not look like an email address.", document.getElementById("email"));
  if (!password) return fail("Enter any password - this is a demo.", document.getElementById("password"));

  let seen = false;
  try {
    sessionStorage.setItem("sdoc-user", email);
    seen = localStorage.getItem("sdoc-walkthrough-done") === "1";
  } catch (e) { /* private window - the prototype still works, just not remembered */ }

  location.href = seen ? "checks.html" : "welcome.html";
});
</script>
</body>
</html>
