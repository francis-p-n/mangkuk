<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Getting started — Document checks</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23a34513'/><path d='M9 16.5l5 5 9-11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
.tour { max-width: 720px; margin: 0 auto; padding: 44px 22px 80px; }
.steps { display: flex; gap: 8px; margin-bottom: 26px; }
.steps i {
  flex: 1; height: 4px; border-radius: 999px; background: var(--sunk); display: block;
}
.steps i.done { background: var(--brand); }
.stepno { font-size: 14px; color: var(--ink-faint); margin: 0 0 6px; }
.tour h1 { font-family: var(--ui-display); font-size: 23px; margin: 0 0 12px; }
.tour p { font-size: 15.5px; line-height: 1.65; margin: 0 0 14px; }
.tour .quiet { color: var(--ink-soft); }
.panel-demo {
  background: var(--card); border: 1px solid var(--rule); border-radius: var(--r-lg);
  padding: 18px 20px; margin: 20px 0 22px;
}
.panel-demo table { margin: 0; }
.pile { display: flex; gap: 13px; align-items: flex-start; margin-bottom: 16px; }
.pile .dot { margin-top: 9px; }
.pile b { display: block; font-size: 15px; }
.pile span { color: var(--ink-soft); font-size: 15px; }
.nav { display: flex; gap: 10px; align-items: center; margin-top: 30px; }
.nav .skip { margin-left: auto; font-size: 14.5px; color: var(--ink-faint);
             background: none; border: 0; cursor: pointer; font-family: inherit; }
.nav .skip:hover { color: var(--ink-soft); text-decoration: underline; }
</style>
</head>
<body>
<div class="tour">
  <div class="steps" id="steps" aria-hidden="true"></div>
  <p class="stepno" id="stepno"></p>
  <div id="stage"></div>

  <div class="nav">
    <button class="btn" id="back" hidden>Back</button>
    <button class="btn go" id="next">Next</button>
    <button class="skip" id="skip">Skip, I know this</button>
  </div>
</div>

<script>
const STEPS = [
  {
    title: "Two documents, seven details",
    html: `
      <p>You send the carrier a <b>shipping instruction</b>. They send back a
        <b>draft bill of lading</b> for you to approve.</p>
      <p>Somebody has to read both and check they say the same thing. This page
        has already done that for every draft that came in today.</p>
      <p class="quiet">Seven details are compared on each one: the shipper, the
        consignee, the notify party, the loading port, the discharge port, how
        many containers, and the gross weight.</p>`
  },
  {
    title: "Everything lands in one of three piles",
    html: `
      <div class="pile"><i class="dot fix"></i><div>
        <b>Needs fixing</b>
        <span>A detail on the carrier's draft does not match your instruction.
          You will see both versions side by side.</span></div></div>
      <div class="pile"><i class="dot look"></i><div>
        <b>Needs you to look</b>
        <span>Something stopped the check — a missing attachment, a file that
          would not open, or the wrong document altogether. Nothing is guessed
          when this happens.</span></div></div>
      <div class="pile"><i class="dot fine"></i><div>
        <b>Fine</b>
        <span>All seven details match. Nothing for you to do.</span></div></div>
      <p class="quiet">Your working day is the first pile. The third is there
        so you can confirm it was actually checked.</p>`
  },
  {
    title: "Reading a mismatch",
    html: `
      <p>When something does not match, both versions are shown together, with
        the wording each document used underneath.</p>
      <div class="panel-demo">
        <table>
          <thead><tr><th>Detail</th><th>Your instruction says</th><th>The carrier's draft says</th><th></th></tr></thead>
          <tbody>
            <tr><td>Shipper</td><td>April Far East (M) SDN BHD<span class="src">Shipper</span></td>
                <td>April Far East (M) SDN BHD<span class="src">SHIPPER</span></td><td><span class="yes">&#10003;</span></td></tr>
            <tr class="bad"><td>Consignee</td>
                <td>East Bright FZ-LLC<span class="src">Consignee (Non-Negotiable)</span></td>
                <td>UAB Novakopa<span class="src">To the Order of</span></td><td></td></tr>
          </tbody>
        </table>
      </div>
      <p>Notice the small grey text. One document called it
        <b>Consignee</b> and the other called it <b>To the Order of</b> — the
        same thing under a different name. Matching is done by meaning, so a
        renamed field is never mistaken for a matching one.</p>`
  },
  {
    title: "Nothing is sent without you",
    html: `
      <p>When a draft needs fixing you can have the correction email written
        out for you, quoting both versions of every detail that is wrong.</p>
      <p><b>It is never sent.</b> You read it, change whatever you like, and
        send it from your own mailbox. Your name stays on the correspondence,
        and so does the decision.</p>
      <p class="quiet">Same for anything the system could not check. It stops
        and tells you why rather than taking a guess.</p>`
  },
];

let i = 0;
const stage = document.getElementById("stage");
const stepsBar = document.getElementById("steps");
const back = document.getElementById("back");
const next = document.getElementById("next");

stepsBar.innerHTML = STEPS.map(() => "<i></i>").join("");

function draw() {
  const step = STEPS[i];
  document.getElementById("stepno").textContent = `Step ${i + 1} of ${STEPS.length}`;
  stage.innerHTML = `<h1>${step.title}</h1>${step.html}`;
  [...stepsBar.children].forEach((el, n) => el.classList.toggle("done", n <= i));
  back.hidden = i === 0;
  next.textContent = i === STEPS.length - 1 ? "Start reviewing" : "Next";
  next.focus();
}

function finish() {
  try {
    localStorage.setItem("sdoc-walkthrough-done", "1");
    // The board's inline explainer repeats this walkthrough, so anyone who has
    // just read it should not be shown it again on arrival.
    localStorage.setItem("sdoc-intro-seen", "1");
  } catch (e) { /* fine without it */ }
  location.href = "home.html";
}

next.addEventListener("click", () => { i === STEPS.length - 1 ? finish() : (i++, draw()); });
back.addEventListener("click", () => { if (i > 0) { i--; draw(); } });
document.getElementById("skip").addEventListener("click", finish);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" && i < STEPS.length - 1) { i++; draw(); }
  if (e.key === "ArrowLeft" && i > 0) { i--; draw(); }
});

draw();
</script>
</body>
</html>
